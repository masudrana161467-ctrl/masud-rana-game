

<!doctype html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>মাসুদ রানা Masud Rana</title>
<style>
body{margin:0;background:#75b967;font-family:sans-serif;color:white}
header{background:#244b2b;padding:12px;text-align:center;font-size:20px}
#game{height:65vh;position:relative;overflow:hidden;background:linear-gradient(#8bd0ee 0 35%,#7ac56b 35%);border-bottom:8px solid #548e43}
.path{position:absolute;background:#d9bd82}
#road1{width:100%;height:55px;top:55%;left:0}
#road2{height:100%;width:55px;left:48%;top:0}
.house{position:absolute;width:110px;height:75px;background:#e7d0a1;border:3px solid #9b6840;top:20%;left:12%;text-align:center;color:#333;padding-top:30px}
.roof{position:absolute;top:-35px;left:-10px;width:130px;height:40px;background:#a34d35;clip-path:polygon(50% 0,100% 100%,0 100%)}
.shop{left:auto;right:10%;top:22%;background:#f2d18d}
.farm{position:absolute;left:10%;bottom:8%;width:150px;height:65px;background:#98723e;border:4px solid #6c4c2b;color:#fff;text-align:center;padding-top:15px}
.person{position:absolute;width:28px;height:48px;background:#2459a2;border-radius:8px;left:48%;top:48%;text-align:center}
.person:before{content:"";position:absolute;width:22px;height:22px;background:#e5b17c;border-radius:50%;top:-18px;left:3px}
.controls{display:flex;justify-content:space-around;align-items:center;padding:10px}
button{background:#173c24;color:white;border:2px solid #ffffff66;border-radius:12px;padding:14px;font-size:18px}
#msg{text-align:center;padding:8px;color:#fff}
</style>
</head>
<body>
<header>🌾 মাসুদ রানা Masud Rana</header>
<div id="game">
<div class="path" id="road1"></div>
<div class="path" id="road2"></div>
<div class="house"><div class="roof"></div>নিজের বাড়ি</div>
<div class="house shop"><div class="roof"></div>গ্রামের দোকান</div>
<div class="farm">ধানের জমি 🌱</div>
<div class="person" id="player">🙂</div>
</div>
<div id="msg">গ্রামে ঘুরে দেখো! বাড়ি বা দোকানের কাছে যাও।</div>
<div class="controls">
<div>
<button onclick="move(0,-15)">⬆️</button><br>
<button onclick="move(-15,0)">⬅️</button>
<button onclick="move(0,15)">⬇️</button>
<button onclick="move(15,0)">➡️</button>
</div>
<button onclick="act()">কাজ করো</button>
</div>
<script>
let x=48,y=48,money=20;
function move(a,b){
x=Math.max(0,Math.min(95,x+a/5));
y=Math.max(0,Math.min(90,y+b/5));
let p=document.getElementById('player');
p.style.left=x+'%';p.style.top=y+'%';
}
function act(){
if(x<35&&y<40){
document.getElementById('msg').innerText='মা মাহফুজা বেগম: বাবা, বাড়ির কাজে সাহায্য করো!';
}else if(x>60&&y<45){
money+=5;
document.getElementById('msg').innerText='দোকানে সাহায্য করলে! ৫ টাকা পেলো। মোট টাকা: '+money;
}else if(y>65){
document.getElementById('msg').innerText='জমিতে বীজ বপন করলে। 🌱';
}else{
document.getElementById('msg').innerText='বাবা আফাজ উদ্দিন মাঠে কাজ করছেন। গ্রাম ঘুরে দেখো!';
}
}
</script>
</body>
</html>
